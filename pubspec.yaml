name: financy_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_modular: ^6.3.4
  animate_do: ^3.3.4
  mocktail: ^1.0.4
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  flutter_svg: ^2.0.17
  either_dart: ^1.0.0
  equatable: ^2.0.7
  internet_connection_checker: ^3.0.1
  flutter_secure_storage: ^9.2.4
  flutter_svg_test: ^1.0.3
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  google_sign_in_ios: ^5.7.8
  nonce: ^1.2.0
  crypto: ^3.0.6
  google_sign_in_mocks: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100
